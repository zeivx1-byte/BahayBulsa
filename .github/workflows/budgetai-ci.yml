name: BahayBulsa desktop checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: budgetai

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: budgetai/requirements.txt

      - name: Install requirements
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run tests
        run: python -m pytest -q -o addopts= -p no:cacheprovider

      - name: Verify budgeting datasets
        run: |
          python -m dataset.validate_dataset
          python -m evaluation.cases --check
