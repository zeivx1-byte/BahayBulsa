name: Publish BudgetAI image

on:
  workflow_dispatch:

permissions: {}

defaults:
  run:
    working-directory: budgetai

concurrency:
  group: budgetai-image-${{ github.sha }}
  cancel-in-progress: false

jobs:
  checks:
    permissions:
      contents: read
    uses: ./.github/workflows/budgetai-ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and smoke-test the image
        id: image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-budgetai"
          tag="$image:sha-$GITHUB_SHA"
          docker buildx build --load --platform linux/amd64 --tag "$tag" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" .

          container="$(docker run --detach --network none "$tag")"
          trap 'docker rm --force "$container" >/dev/null' EXIT
          if ! docker exec -i "$container" python - <<'PY'
          import json
          import time
          from urllib.request import urlopen

          url = "http://127.0.0.1:8000"
          for attempt in range(20):
              try:
                  with urlopen(url + "/health", timeout=2) as response:
                      assert json.load(response) == {"status": "ok"}
              except OSError:
                  if attempt == 19:
                      raise
                  time.sleep(1)
              else:
                  break

          with urlopen(url + "/openapi.json", timeout=2) as response:
              paths = json.load(response)["paths"]
          assert "post" in paths["/budget"] and "post" in paths["/chat"]
          PY
          then
            docker logs "$container"
            exit 1
          fi
          printf 'name=%s\ntag=%s\n' "$image" "$tag" >> "$GITHUB_OUTPUT"

      - name: Sign in to GitHub Container Registry
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish the tested image and report its digest
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TAG: ${{ steps.image.outputs.tag }}
        run: |
          docker push "$TAG"
          digest="$(docker buildx imagetools inspect "$TAG" --format '{{json .Manifest}}' \
            | jq -er '.digest | select(test("^sha256:[a-f0-9]{64}$"))')"
          {
            printf '## Published BudgetAI API image\n\n'
            printf 'Commit tag %s\n\n' "$TAG"
            printf 'Set this in the deployment environment for the exact image.\n\n'
            printf '    BUDGETAI_IMAGE=%s@%s\n' "$IMAGE" "$digest"
          } >> "$GITHUB_STEP_SUMMARY"
