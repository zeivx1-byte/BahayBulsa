name: budgetai

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      BUDGETAI_DOMAIN: "${BUDGETAI_DOMAIN:?Set the public DNS hostname in deploy/.env}"
      BUDGETAI_USERNAME: "${BUDGETAI_USERNAME:?Set the test username in deploy/.env}"
      BUDGETAI_PASSWORD_HASH: "${BUDGETAI_PASSWORD_HASH:?Set the Caddy password hash in deploy/.env}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      api:
        condition: service_healthy

  api:
    image: "${BUDGETAI_IMAGE:?Set the published GHCR image in deploy/.env}"
    restart: unless-stopped
    environment:
      OLLAMA_HOST: http://ollama:11434
      # API is reachable only on the Compose networks. Caddy supplies the forwarded headers.
      FORWARDED_ALLOW_IPS: "*"
      BUDGETAI_MODEL: &model "${BUDGETAI_MODEL:-qwen3.5:2b-q4_K_M}"
    networks: [edge, model]
    depends_on:
      ollama-init:
        condition: service_completed_successfully

  ollama:
    image: &ollama_image ollama/ollama:0.40.16
    restart: unless-stopped
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - ollama_data:/root/.ollama
    networks: [model]
    healthcheck:
      test: ["CMD-SHELL", "OLLAMA_HOST=http://127.0.0.1:11434 ollama list"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 12

  ollama-init:
    image: *ollama_image
    entrypoint: ["ollama"]
    command: ["pull", *model]
    environment:
      OLLAMA_HOST: http://ollama:11434
    networks: [model]
    depends_on:
      ollama:
        condition: service_healthy

networks:
  edge:
  model:

volumes:
  ollama_data:
  caddy_data:
  caddy_config:
